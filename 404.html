<!doctype html>
<html lang="it">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#e10600">
  <meta name="robots" content="noindex">

  <title>Pagina non trovata — GPJ</title>

  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/favicon.png">
  <link rel="manifest" href="site.webmanifest">

  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    .not-found {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      background: #111;
      color: #fff;
    }
    .not-found .brand-mark { width: 64px; height: 64px; margin-bottom: 34px; }
    .not-found .eyebrow { color: rgba(255,255,255,.6); }
    .not-found h1 {
      font-family: Manrope, sans-serif;
      font-size: clamp(80px, 16vw, 160px);
      letter-spacing: -.05em;
      line-height: .9;
      margin: 10px 0 18px;
      color: var(--red);
    }
    .not-found p {
      max-width: 46ch;
      color: rgba(255,255,255,.75);
      font-size: 16px;
      line-height: 1.7;
      margin: 0 0 34px;
    }
    .not-found .links { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  </style>
</head>

<body>

  <main class="not-found">

    <span class="brand-mark">
      <img decoding="async" src="images/gpj-mark.png" alt="" width="64" height="64">
    </span>

    <div class="eyebrow">GPJ.Visuals</div>
    <h1>404</h1>

    <p>
      Questa pagina non esiste, o si &egrave; spostata. Magari cercavi un progetto
      che nel frattempo ho rinominato o tolto dal portfolio.
    </p>

    <div class="links">
      <a class="btn btn-red" href="index.html">Torna alla home</a>
      <a class="btn btn-outline" href="index.html#work">Vai al portfolio</a>
    </div>

  </main>

</body>

</html>
